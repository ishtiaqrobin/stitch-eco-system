<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OTP Verification | UniMart</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-dim": "#d9dadb",
              "on-primary-fixed-variant": "#004493",
              "tertiary": "#005abf",
              "error": "#ba1a1a",
              "on-primary": "#ffffff",
              "surface-container-low": "#f3f4f5",
              "outline": "#727785",
              "on-secondary": "#ffffff",
              "surface-bright": "#f8f9fa",
              "secondary-fixed": "#ffdad3",
              "tertiary-fixed": "#d8e2ff",
              "primary": "#005bbf",
              "on-error": "#ffffff",
              "on-background": "#191c1d",
              "primary-container": "#1a73e8",
              "inverse-primary": "#adc7ff",
              "outline-variant": "#c1c6d6",
              "on-surface-variant": "#414754",
              "tertiary-container": "#0872ed",
              "surface-tint": "#005bc0",
              "primary-fixed": "#d8e2ff",
              "inverse-on-surface": "#f0f1f2",
              "surface-variant": "#e1e3e4",
              "error-container": "#ffdad6",
              "surface-container": "#edeeef",
              "on-secondary-fixed-variant": "#8b1a02",
              "surface": "#f8f9fa",
              "on-error-container": "#93000a",
              "on-secondary-fixed": "#3e0500",
              "tertiary-fixed-dim": "#adc6ff",
              "secondary-container": "#ff6d4e",
              "on-secondary-container": "#680f00",
              "surface-container-lowest": "#ffffff",
              "secondary-fixed-dim": "#ffb4a4",
              "on-tertiary-fixed": "#001a41",
              "on-primary-container": "#ffffff",
              "surface-container-high": "#e7e8e9",
              "on-tertiary-container": "#ffffff",
              "on-primary-fixed": "#001a41",
              "inverse-surface": "#2e3132",
              "surface-container-highest": "#e1e3e4",
              "secondary": "#ad3219",
              "on-tertiary": "#ffffff",
              "on-tertiary-fixed-variant": "#004493",
              "primary-fixed-dim": "#adc7ff",
              "on-surface": "#191c1d",
              "background": "#f8f9fa"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .otp-input:focus {
            box-shadow: 0 0 0 2px rgba(0, 91, 191, 0.4);
        }
        .editorial-gradient {
            background: linear-gradient(135deg, #005bbf 0%, #1a73e8 100%);
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col">
<!-- Supressing TopNavBar and Footer as per Navigation Shell Logic: Transactional Page (OTP) -->
<main class="flex-grow flex items-center justify-center px-6 py-12">
<div class="w-full max-w-md">
<!-- Branding Moment -->
<div class="text-center mb-10">
<h1 class="font-headline font-black text-3xl tracking-tighter text-primary mb-2">UniMart</h1>
<div class="h-1 w-12 bg-secondary-container mx-auto rounded-full"></div>
</div>
<!-- Content Card -->
<div class="bg-surface-container-lowest rounded-xl p-8 md:p-10 shadow-sm shadow-on-surface/5">
<div class="mb-8 text-center">
<h2 class="font-headline font-extrabold text-2xl text-on-surface mb-3 tracking-tight">Verify your account</h2>
<p class="text-on-surface-variant text-sm leading-relaxed">
                        We've sent a 6-digit verification code to <br/>
<span class="font-semibold text-on-surface">+880 1XXX-XXXX92</span>
</p>
</div>
<!-- OTP Input Grid -->
<form action="#" class="space-y-8" method="POST">
<div class="flex justify-between gap-2 md:gap-3" id="otp-container">
<input aria-label="Digit 1" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-xl font-bold bg-surface-container-highest border-none rounded-lg text-primary focus:ring-0 transition-all" maxlength="1" type="text"/>
<input aria-label="Digit 2" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-xl font-bold bg-surface-container-highest border-none rounded-lg text-primary focus:ring-0 transition-all" maxlength="1" type="text"/>
<input aria-label="Digit 3" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-xl font-bold bg-surface-container-highest border-none rounded-lg text-primary focus:ring-0 transition-all" maxlength="1" type="text"/>
<input aria-label="Digit 4" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-xl font-bold bg-surface-container-highest border-none rounded-lg text-primary focus:ring-0 transition-all" maxlength="1" type="text"/>
<input aria-label="Digit 5" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-xl font-bold bg-surface-container-highest border-none rounded-lg text-primary focus:ring-0 transition-all" maxlength="1" type="text"/>
<input aria-label="Digit 6" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-xl font-bold bg-surface-container-highest border-none rounded-lg text-primary focus:ring-0 transition-all" maxlength="1" type="text"/>
</div>
<div class="space-y-6">
<button class="w-full editorial-gradient text-on-primary font-semibold py-4 rounded-full shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span>Confirm Code</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
<div class="text-center">
<p class="text-sm text-on-surface-variant mb-1">Didn't receive code?</p>
<button class="text-primary font-bold text-sm hover:underline transition-all" type="button">
                                Resend OTP
                            </button>
</div>
</div>
</form>
</div>
<!-- Footer Links (Minimal for Transactional) -->
<div class="mt-12 flex flex-col items-center gap-6">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="shield_lock">shield_lock</span>
</div>
<div class="text-left">
<p class="text-xs font-bold text-on-surface uppercase tracking-widest">Secure Verification</p>
<p class="text-[10px] text-on-surface-variant font-medium">Your data is encrypted and secure</p>
</div>
</div>
<nav class="flex gap-6">
<a class="text-xs font-label text-outline hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="text-xs font-label text-outline hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="text-xs font-label text-outline hover:text-primary transition-colors" href="#">Help Center</a>
</nav>
</div>
</div>
</main>
<!-- Background Decorative Elements -->
<div class="fixed top-0 right-0 -z-10 w-1/3 h-1/3 bg-primary/5 blur-[120px] rounded-full"></div>
<div class="fixed bottom-0 left-0 -z-10 w-1/4 h-1/4 bg-secondary/5 blur-[100px] rounded-full"></div>
</body></html>
