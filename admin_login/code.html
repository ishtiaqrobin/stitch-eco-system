<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>UniMart Admin Login</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-low": "#f3f4f5",
              "secondary-container": "#ff6d4e",
              "primary-fixed": "#d8e2ff",
              "on-surface": "#191c1d",
              "surface-container-highest": "#e1e3e4",
              "surface-container-high": "#e7e8e9",
              "surface": "#f8f9fa",
              "error": "#ba1a1a",
              "background": "#f8f9fa",
              "on-primary-fixed": "#001a41",
              "outline": "#727785",
              "on-secondary-fixed": "#3e0500",
              "on-secondary-container": "#680f00",
              "error-container": "#ffdad6",
              "outline-variant": "#c1c6d6",
              "on-primary-container": "#ffffff",
              "inverse-primary": "#adc7ff",
              "surface-container": "#edeeef",
              "primary-fixed-dim": "#adc7ff",
              "on-primary": "#ffffff",
              "on-tertiary-fixed": "#001a41",
              "inverse-surface": "#2e3132",
              "on-tertiary-fixed-variant": "#004493",
              "inverse-on-surface": "#f0f1f2",
              "tertiary-container": "#0872ed",
              "surface-container-lowest": "#ffffff",
              "on-tertiary": "#ffffff",
              "on-surface-variant": "#414754",
              "on-background": "#191c1d",
              "on-tertiary-container": "#ffffff",
              "tertiary-fixed-dim": "#adc6ff",
              "tertiary": "#005abf",
              "surface-dim": "#d9dadb",
              "primary": "#005bbf",
              "tertiary-fixed": "#d8e2ff",
              "secondary": "#ad3219",
              "on-secondary": "#ffffff",
              "on-error-container": "#93000a",
              "on-secondary-fixed-variant": "#8b1a02",
              "on-primary-fixed-variant": "#004493",
              "surface-bright": "#f8f9fa",
              "secondary-fixed": "#ffdad3",
              "primary-container": "#1a73e8",
              "surface-variant": "#e1e3e4",
              "surface-tint": "#005bc0",
              "secondary-fixed-dim": "#ffb4a4",
              "on-error": "#ffffff"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-effect {
            backdrop-filter: blur(20px);
            background-color: rgba(248, 249, 250, 0.7);
        }
        .editorial-gradient {
            background: linear-gradient(135deg, #005bbf 0%, #1a73e8 100%);
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface flex items-center justify-center min-h-screen p-6 overflow-hidden relative">
<!-- Subtle Brand Background Element -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[5%] w-[40%] h-[60%] rounded-full bg-primary-fixed/20 blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[5%] w-[40%] h-[60%] rounded-full bg-secondary-fixed/20 blur-[120px]"></div>
</div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-md">
<!-- Brand Logo Area -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-white shadow-sm mb-4">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="admin_panel_settings">admin_panel_settings</span>
</div>
<h1 class="font-headline font-extrabold text-3xl tracking-tight text-on-surface">UniMart Admin</h1>
<p class="text-on-surface-variant mt-2 font-medium">Internal Management Suite</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-8 shadow-[0_8px_32px_rgba(25,28,29,0.04)] ring-1 ring-outline-variant/15">
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant" for="email">Admin Email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-11 pr-4 py-3.5 bg-surface-container-highest border-none rounded-lg focus:ring-2 focus:ring-primary/40 transition-all text-on-surface placeholder:text-outline/60" id="email" name="email" placeholder="admin@unimart.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block text-sm font-semibold text-on-surface-variant" for="password">Secure Password</label>
<a class="text-xs font-bold text-primary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-11 pr-4 py-3.5 bg-surface-container-highest border-none rounded-lg focus:ring-2 focus:ring-primary/40 transition-all text-on-surface placeholder:text-outline/60" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me & IP Tracking -->
<div class="flex items-center">
<div class="flex items-center">
<input class="h-4 w-4 text-primary border-outline-variant rounded focus:ring-primary/40 bg-surface-container-highest" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-sm text-on-surface-variant font-medium" for="remember-me">
                            Remember me
                        </label>
</div>
</div>
<!-- Sign In Button -->
<button class="editorial-gradient w-full py-4 px-6 text-on-primary font-headline font-bold rounded-full shadow-lg shadow-primary/20 hover:shadow-primary/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group" type="submit">
                    Sign In to Admin Panel
                    <span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
</div>
<!-- Security Footer -->
<footer class="mt-8 text-center space-y-4">
<div class="flex items-center justify-center gap-2 py-2 px-4 bg-error-container/20 rounded-full inline-flex border border-error-container/30">
<span class="material-symbols-outlined text-error text-sm" data-icon="verified_user" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="text-[10px] uppercase tracking-widest font-bold text-error">Internal Access Only</span>
</div>
<p class="text-xs text-on-surface-variant leading-relaxed">
                By signing in, you agree to UniMart's internal data protection policies.<br/>
<span class="font-semibold text-on-surface">IP logged for security: 192.168.1.104</span>
</p>
</footer>
</main>
<!-- Visual Anchor: Dynamic Background Image (Corner Overlay) -->
<div class="absolute bottom-12 right-12 w-48 h-48 opacity-10 grayscale pointer-events-none hidden lg:block">
<img alt="Abstract Gradient" class="w-full h-full object-cover rounded-3xl transform rotate-12" data-alt="smooth professional gradient flowing from corporate navy blue to bright electronic blue with a premium micro-texture grain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBihDRDe7s_oKuBcTLMP4bfRN6FdS3w1Yd9WzjBA9lNF9Njpv2PVn3M3iZQvJKkSubUdmWzyqmn3dwjfvM-oKcPmx_5v9JwtOnc4wxQwfUsutK25t96wDJwntW-l0YuqcGTs9hkptZlexdR4BtB9cQLXKhdgFS2m-t-5MPnuj2WpzAjQ83WY4pAoGqXV-vmhY74rQeCWUqDG_qLheigMn5M22J-M0scc8BK6Tm5V8wg7sXYEVcgRkalSbTfzSSr44gd9dDh5iEkKkQ"/>
</div>
</body></html>
