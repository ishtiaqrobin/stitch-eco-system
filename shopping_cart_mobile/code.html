<!DOCTYPE html>

<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .bg-glass {
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-slate-50 flex items-center justify-between px-4 h-16 w-full shadow-none">
<div class="flex items-center gap-3">
<button class="text-blue-700 hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-manrope font-extrabold tracking-tight text-blue-700 text-xl">UniMart</h1>
</div>
<div class="flex items-center gap-2">
<button class="relative text-blue-700 hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">shopping_cart</span>
<span class="absolute -top-1 -right-1 bg-secondary text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">2</span>
</button>
</div>
</header>
<main class="pt-20 pb-40 px-4 max-w-lg mx-auto">
<!-- Editorial Header -->
<section class="mb-8">
<h2 class="font-headline text-3xl font-extrabold text-on-surface mb-1">Your Basket</h2>
<p class="text-on-surface-variant font-medium">Review your curated selection</p>
</section>
<!-- Cart Items List -->
<div class="space-y-6">
<!-- Item 1: Artisan Saree -->
<div class="bg-surface-container-lowest rounded-xl p-4 flex gap-4 transition-transform active:scale-[0.98]">
<div class="w-24 h-32 rounded-lg overflow-hidden flex-shrink-0 bg-surface-container">

</div>
<div class="flex flex-col justify-between flex-grow">
<div>
<div class="flex justify-between items-start">
<h3 class="font-headline font-bold text-lg text-on-surface leading-tight">Artisan Saree</h3>
<button class="text-outline hover:text-error transition-colors">
<span class="material-symbols-outlined text-xl">delete</span>
</button>
</div>
<p class="text-label-sm text-outline font-medium mt-1">Hand-woven Silk</p>
<p class="text-primary font-bold mt-2 text-lg">৳ 12,500</p>
</div>
<!-- Stepper -->
<div class="flex items-center justify-between mt-3">
<div class="flex items-center bg-surface-container rounded-full p-1 gap-4">
<button class="w-8 h-8 rounded-full bg-surface-container-lowest flex items-center justify-center text-primary active:scale-90 transition-transform">
<span class="material-symbols-outlined text-sm">remove</span>
</button>
<span class="font-bold text-on-surface">1</span>
<button class="w-8 h-8 rounded-full bg-surface-container-lowest flex items-center justify-center text-primary active:scale-90 transition-transform">
<span class="material-symbols-outlined text-sm">add</span>
</button>
</div>
</div>
</div>
</div>
<!-- Item 2: Handmade Pottery -->
<div class="bg-surface-container-lowest rounded-xl p-4 flex gap-4 transition-transform active:scale-[0.98]">
<div class="w-24 h-32 rounded-lg overflow-hidden flex-shrink-0 bg-surface-container">
<img alt="Handmade Pottery" class="w-full h-full object-cover" data-alt="Earth-toned ceramic vase with organic textures and minimalist glaze displayed on a clean white surface with natural soft shadows" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCTgjKF5Mml6WdkVPVTFL-kLfy78vmm92b7-hhaSle285-OrIyI7bAvnX1982D36DoqDWUGAu3InjH8al8QDgTHQGefTdT2jO6Augv3U6DKzICZlk8yNCz7pX2vi6hgiBqlXvUnTuGV_0sgrEhSrcDc4Gd0BHE1k6X0mHEb5xNbavbcSwWCxUBrmgG0YydiehtBov7USeqAjbNWeYdCd5YNWptyb-kKwZ2T_BEYiUMMEPlqz92LWgKesBMShUO13b6V-eGdjQ_GZgA"/>
</div>
<div class="flex flex-col justify-between flex-grow">
<div>
<div class="flex justify-between items-start">
<h3 class="font-headline font-bold text-lg text-on-surface leading-tight">Handmade Pottery</h3>
<button class="text-outline hover:text-error transition-colors">
<span class="material-symbols-outlined text-xl">delete</span>
</button>
</div>
<p class="text-label-sm text-outline font-medium mt-1">Terracotta Vase</p>
<p class="text-primary font-bold mt-2 text-lg">৳ 2,200</p>
</div>
<!-- Stepper -->
<div class="flex items-center justify-between mt-3">
<div class="flex items-center bg-surface-container rounded-full p-1 gap-4">
<button class="w-8 h-8 rounded-full bg-surface-container-lowest flex items-center justify-center text-primary active:scale-90 transition-transform">
<span class="material-symbols-outlined text-sm">remove</span>
</button>
<span class="font-bold text-on-surface">2</span>
<button class="w-8 h-8 rounded-full bg-surface-container-lowest flex items-center justify-center text-primary active:scale-90 transition-transform">
<span class="material-symbols-outlined text-sm">add</span>
</button>
</div>
</div>
</div>
</div>
</div>
<!-- Promo Code Section -->
<div class="mt-10 bg-surface-container-low p-4 rounded-xl">
<p class="text-on-surface font-semibold mb-3">Have a promo code?</p>
<div class="flex gap-2">
<input class="flex-grow bg-surface-container-highest border-none rounded-lg px-4 text-on-surface focus:ring-2 focus:ring-primary/40 transition-all outline-none" placeholder="Enter code" type="text"/>
<button class="bg-surface-container-high text-primary font-bold px-6 py-3 rounded-lg hover:bg-surface-container-highest active:scale-95 transition-all">Apply</button>
</div>
</div>
</main>
<!-- Floating Checkout Bar -->
<div class="fixed bottom-0 left-0 w-full z-50">
<!-- Summary Card -->
<div class="bg-white/70 backdrop-blur-xl rounded-t-3xl shadow-[0_-4px_40px_0_rgba(0,0,0,0.08)] px-6 pt-6 pb-10">
<div class="space-y-3 mb-6">
<div class="flex justify-between items-center">
<span class="text-on-surface-variant font-medium">Subtotal</span>
<span class="text-on-surface font-bold">৳ 16,900</span>
</div>
<div class="flex justify-between items-center">
<span class="text-on-surface-variant font-medium">Delivery Fee</span>
<span class="text-on-surface font-bold">৳ 120</span>
</div>
<div class="h-px bg-outline-variant/15 my-2"></div>
<div class="flex justify-between items-center">
<span class="text-on-surface text-lg font-bold">Total</span>
<span class="text-primary text-2xl font-black">৳ 17,020</span>
</div>
</div>
<!-- Checkout Button -->
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline font-bold text-lg py-4 rounded-full shadow-lg shadow-primary/20 active:scale-95 transition-all flex items-center justify-center gap-2">
                Proceed to Checkout
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<!-- BottomNavBar (Suppressed due to Task-Focused Checkout Flow as per Design System rules) -->
<!-- Note: Following "The Destination Rule" and "Automatic Suppression", the BottomNavBar is hidden here to focus on Checkout action -->
</div>
<!-- Bottom Nav Spacer -->
<div class="h-20 md:hidden"></div>
